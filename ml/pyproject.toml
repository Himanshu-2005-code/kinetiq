[project]
name = "kinetiq"
version = "0.1.0"
description = "Real-time exercise recognition, rep counting and form analysis from pose landmarks"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "pyyaml>=6",
  "onnx>=1.15",
  "onnxruntime>=1.17",
]

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8"]

[tool.setuptools]
packages = ["kinetiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]
