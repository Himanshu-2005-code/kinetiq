out_dir: runs/default

data:
  n_frames: 64        # ~2-4 s of video depending on fps; must match the web client window
  val_size: 2048

model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  ffn_mult: 2.75
  dropout: 0.1
  drop_path: 0.1
  max_len: 256

loss:
  exercise: 1.0
  faults: 1.0
  phase: 2.0
  active: 0.5
  label_smoothing: 0.05

train:
  seed: 0
  steps: 6000
  batch_size: 64
  lr: 1.0e-3
  warmup: 300
  weight_decay: 0.05
  grad_clip: 1.0
  ema_decay: 0.998
  workers: 1
  threads: 2
  log_every: 100
  eval_every: 500
